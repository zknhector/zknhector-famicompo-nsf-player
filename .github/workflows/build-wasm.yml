name: Build NSF Player WASM

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "$PWD" >> "$GITHUB_PATH"
          echo "$PWD/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build libgme WASM
        run: |
          chmod +x tools/build-libgme-wasm.sh
          source emsdk/emsdk_env.sh
          ./tools/build-libgme-wasm.sh

      - name: Create player ZIP
        run: |
          zip -r nsfplayer3-built.zip \
            index.html \
            manifest.json \
            service-worker.js \
            css \
            icons \
            js \
            src \
            tools \
            wasm \
            README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsfplayer3-built
          path: nsfplayer3-built.zip

      - name: Prepare GitHub Pages
        run: |
          rm -rf pages
          mkdir -p pages
          cp index.html pages/
          cp manifest.json pages/
          cp service-worker.js pages/
          cp -r css pages/
          cp -r js pages/
          cp -r wasm pages/
          touch pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
