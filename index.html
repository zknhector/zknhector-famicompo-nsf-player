<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Chromebook用 ファミコン NSF / NSFe プレイヤー
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#222222"
    >

</head>


<body>


<header>

    <h1>
        🎮 ファミコン NSF Player 🎮
    </h1>

    <p>
        Chromebook用 ファミコン NSF / NSFe プレイヤー
    </p>

</header>


<main>


    <!-- =========================================
         LEFT SIDE
         ファイル追加 + 曲ライブラリ
         ========================================= -->

    <div id="left-panel">


        <section id="drop-area">

            <h2>
                NSF / NSFe ファイル追加
            </h2>

            <p>
                ファイルを選択してください
            </p>

            <input
                type="file"
                id="file-input"
                accept=".nsf,.nsfe"
                multiple
            >

        </section>


        <section id="library">

            <h2>
                曲ライブラリ
            </h2>

            <ul id="song-list">

                <li>
                    まだ曲がありません
                </li>

            </ul>

        </section>


    </div>


    <!-- =========================================
         RIGHT SIDE
         曲情報 + Engine Status + Player
         ========================================= -->

    <div id="right-panel">


        <section id="info">

            <h2>
                曲情報
            </h2>

            <p>
                Title :
                <span id="title">
                    -
                </span>
            </p>

            <p>
                Composer :
                <span id="composer">
                    -
                </span>
            </p>

            <p>
                Copyright :
                <span id="copyright">
                    -
                </span>
            </p>

            <p>
                Sound Chip :
                <span id="chip">
                    -
                </span>
            </p>

            <p>
                Track :
                <span id="track">
                    -
                </span>
            </p>

        </section>


        <section id="engine-info">

            <h2>
                Engine Status
            </h2>

            <p>
                Engine :
                <span id="engine">
                    libgme
                </span>
            </p>

            <p>
                Extension :
                <span id="extension">
                    -
                </span>
            </p>

        </section>


        <section id="player">

            <div id="player-buttons">

                <button id="prev">
                    <span class="button-icon">◀◀</span>
                    <span class="button-label">PREV</span>
                </button>

                <button id="play">
                    <span class="button-icon">▶</span>
                    <span class="button-label">PLAY</span>
                </button>

                <button id="stop">
                    <span class="button-icon">■</span>
                    <span class="button-label">STOP</span>
                </button>

                <button id="next">
                    <span class="button-icon">▶▶</span>
                    <span class="button-label">NEXT</span>
                </button>

            </div>

        </section>


    </div>


</main>


<footer>

    <p>
        Chromebook用 ファミコン NSF / NSFe プレイヤー
    </p>

</footer>


<!--
    JavaScript load order

    wasm/gme.js
         ↓
    libgme-bridge
         ↓
    gme-loader
         ↓
    gme-core
         ↓
    nsf-parser
         ↓
    nsf-engine
         ↓
    library
         ↓
    player
         ↓
    app
-->


<script src="wasm/gme.js"></script>

<script src="js/libgme-bridge.js"></script>

<script src="js/gme-loader.js"></script>

<script src="js/gme-core.js"></script>

<script src="js/nsf-parser.js"></script>

<script src="js/nsf-engine.js"></script>

<script src="js/library.js"></script>

<script src="js/player.js"></script>

<script src="js/app.js"></script>


<script>

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker.register(
                "service-worker.js"
            )
            .then(
                () => {

                    console.log(
                        "Service Worker ready"
                    );

                }
            )
            .catch(
                error => {

                    console.error(
                        error
                    );

                }
            );

        }
    );

}

</script>


</body>

</html>
